<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Metallic Amber Gold Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Cyan Fiber Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Resin Polymer Gradient -->
    <linearGradient id="resinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Shield Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Outer Hexagonal Industrial Shield -->
  <polygon points="256,36 440,110 440,310 256,470 72,310 72,110" 
           fill="#090d16" stroke="url(#amberGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Inner Fiberglass Cross-Hatch Grid Matrix -->
  <g stroke="url(#cyanGrad)" stroke-width="3" opacity="0.45" stroke-dasharray="8,6">
    <!-- Diagonal Fibers Set 1 -->
    <line x1="100" y1="120" x2="412" y2="300" />
    <line x1="100" y1="170" x2="412" y2="350" />
    <line x1="100" y1="220" x2="380" y2="380" />
    <line x1="130" y1="100" x2="412" y2="260" />

    <!-- Diagonal Fibers Set 2 -->
    <line x1="412" y1="120" x2="100" y2="300" />
    <line x1="412" y1="170" x2="100" y2="350" />
    <line x1="412" y1="220" x2="132" y2="380" />
    <line x1="382" y1="100" x2="100" y2="260" />
  </g>

  <!-- Central Polymer Resin Flow Banner -->
  <path d="M 110,250 Q 180,210 256,250 T 402,250 L 402,280 Q 330,320 256,280 T 110,280 Z" 
        fill="url(#resinGrad)" opacity="0.85"/>

  <!-- Bold Typography UFRP -->
  <g text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900">
    <!-- Shadow -->
    <text x="259" y="278" font-size="102" fill="#000" opacity="0.8" letter-spacing="4">UFRP</text>
    <!-- Main Text -->
    <text x="256" y="272" font-size="102" fill="url(#amberGrad)" letter-spacing="4">UFRP</text>
  </g>

  <!-- Subtitle Badge -->
  <rect x="146" y="325" width="220" height="32" rx="8" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="2"/>
  <text x="256" y="346" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    M.G. INDUSTRIES
  </text>

  <!-- Chemical Polymer Molecule Accent Nodes -->
  <circle cx="256" cy="90" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
  <circle cx="120" cy="140" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="392" cy="140" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="256" cy="420" r="12" fill="#14b8a6" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Connection Lines to Nodes -->
  <line x1="256" y1="46" x2="256" y2="76" stroke="#f59e0b" stroke-width="3"/>
  <line x1="256" y1="104" x2="256" y2="160" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="256" y1="360" x2="256" y2="408" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4,4"/>
</svg>
